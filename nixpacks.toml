[phases.setup]
nixPkgs = ["ffmpeg", "python311", "pkg-config", "soundfile", "libsndfile"]

[phases.build]
cmds = [
  "python -m venv /opt/venv",
  ". /opt/venv/bin/activate",
  "pip install --upgrade pip",
  "pip install -r requirements.txt"
]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"

[phases.install]
aptPkgs = ["ffmpeg", "libsox-dev", "libsox-doc", "libsox-fmt-all", "sox", "libavcodec-extra", "libavformat-extra", "libavutil-extra", "libswscale-extra", "libavfilter-extra", "libavdevice-extra"]
